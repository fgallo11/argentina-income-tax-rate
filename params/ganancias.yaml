# Decreto 1242/2013 (vigente 09/2013-12/2015): según la mayor remuneración bruta mensual
# de enero-agosto 2013. Hasta $15.000: sin impuesto. Tramos intermedios: deducciones
# incrementadas. Más de $25.000: deducciones generales.
dto_1242:
  desde: "2013-09"
  hasta: "2015-12"
  umbral_exento: 15000
  # 2013-2014: +20% de deducciones entre 15.001 y 25.000 (PDF págs. 17-18)
  tramos_2013_2014:
    - {hasta: 25000, gni: 18662.40, conyuge: 20736.00, hijo: 10368.00, de_dep: 89579.62}
  # 2015: RG 3770/2015 (PDF pág. 20)
  tramos_2015:
    - {hasta: 18000, gni: 23328.00, conyuge: 25920.00, hijo: 12960.00, de_dep: 111974.40}
    - {hasta: 21000, gni: 22394.88, conyuge: 24883.20, hijo: 12441.60, de_dep: 107495.40}
    - {hasta: 22000, gni: 21461.76, conyuge: 23846.40, hijo: 11923.20, de_dep: 103016.40}
    - {hasta: 23000, gni: 20528.64, conyuge: 22809.60, hijo: 11404.80, de_dep: 98537.52}
    - {hasta: 24000, gni: 20062.08, conyuge: 22291.20, hijo: 11145.60, de_dep: 96297.96}
    - {hasta: 25000, gni: 19595.52, conyuge: 21772.80, hijo: 10886.40, de_dep: 94058.52}

# Ley 27.617 y decretos posteriores: "deducción especial incrementada". Por período:
# remuneración bruta MENSUAL hasta la cual no se retiene (exento) y tope del tramo de
# transición (hasta). Entre ambos, la norma remite a tablas de AFIP que no se transcriben:
# el modelo interpola linealmente (SUPUESTO de modelado, no es la tabla legal).
umbrales_ley_27617:
  - {desde: "2021-01", hasta: "2021-08", exento: 150000, transicion: 173000}
  - {desde: "2021-09", hasta: "2021-12", exento: 175000, transicion: 203000}
  - {desde: "2022-01", hasta: "2022-05", exento: 225937, transicion: 260580}
  - {desde: "2022-06", hasta: "2022-10", exento: 280792, transicion: 324182}
  - {desde: "2022-11", hasta: "2022-12", exento: 330000, transicion: 431988}
  - {desde: "2023-01", hasta: "2023-04", exento: 404062, transicion: 466017}
  - {desde: "2023-05", hasta: "2023-07", exento: 506230, transicion: 583851}
  - {desde: "2023-08", hasta: "2023-09", exento: 700875, transicion: 808341}

# Régimen cedular (oct-2023 a jun-2024, aprox.). Oct-dic 2023: tabla del PDF (verificada).
# Ene-jun 2024: no_verificado -> el modelo reescala la tabla de octubre 2023 por la
# variación del SMVM (la ley fija el mínimo en 15 SMVM). Es una APROXIMACIÓN declarada.
cedular:
  desde: "2023-10"
  hasta: "2024-06"
  smvm_base: 132000   # SMVM de octubre 2023 (15 x 132.000 = 1.980.000, PDF pág. 30)
