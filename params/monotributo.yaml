margen_ganancia: 1.0   # facturación anual = ingreso mensual de la EPH × 12 / margen
margen_nota: >-
  La EPH releva lo que gana el cuentapropista; el monotributo se categoriza por ingresos brutos (facturación).
  Valor central 1: la facturación que se declara al fisco es del orden del ingreso que se declara en la encuesta.
  Evidencia (17/11/2026): en ARCA el impuesto integrado es 0,59 (2019) y 0,37 (2024) de los recursos de
  seguridad social del monotributo (jubilación + obra social); la simulación reproduce esos cocientes con un
  margen de ~0,7 (2019) y ~1,4 (2024). Con márgenes bajos (facturación mucho mayor que el ingreso) la gente cae
  en categorías altas y el cociente se dispara: los monotributistas declaran facturaciones bajas. El nivel total
  se calibra a lo recaudado, así que el margen sólo cambia en qué categoría cae cada uno.
inscripcion_por_decil:
  nota: >-
    Parte de los independientes (cuentapropistas y patrones con ingreso) que en la EPH declaran haber hecho aportes
    como monotributistas en los últimos 3 meses (PP05I = 1), 2023T4-2025T4, ponderada (32.567 observaciones).
    Se usa para los trimestres sin la pregunta (hasta 2023T3); desde 2023T4 se usa la respuesta de cada persona.
  decil: {1: 0.097, 2: 0.093, 3: 0.166, 4: 0.199, 5: 0.228, 6: 0.316, 7: 0.396, 8: 0.418, 9: 0.533, 10: 0.58}
