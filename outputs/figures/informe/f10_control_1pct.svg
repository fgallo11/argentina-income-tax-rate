  <g id="text_24">
   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="7.2" y="18.397812" transform="rotate(-0 7.2 18.397812)">Medida de control: el 1% con lo que declara a ARCA, según cuánto de su ingreso no declara, 2025</text>
  </g>
  <g id="text_25">
   <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(7.2 39.835449)">Declarando todo su ingreso, el 1% paga 22,8%: menos que el promedio (23,6%). Cada parte que no declara se suma a su ingreso sin pagar impuestos y baja su tasa.</text>
   <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(7.2 51.11802)">El ingreso no salarial es todo lo que no es sueldo (alquileres, intereses, dividendos, negocios, honorarios, jubilaciones, exentos): el 85% de lo que declara.</text>
  </g>
  <g id="text_26">
   <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(7.2 495.881572)">Fuente: elaboración propia con anuarios de estadísticas tributarias de ARCA (cuadros 2.2.2.1.1, 2.2.2.1.2, 2.2.2.1.4 y 2.2.2.1.8; año fiscal 2024 llevado a 2025 con la variación del ingreso del decil 10 de la EPH),</text>
   <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(7.2 504.935568)">recaudación DNIAF, ENGHo y EPH (INDEC). Medida C: el 1% de la población con mayores ingresos declarados en Ganancias. Consumo: punto medio entre el que calcula ARCA y el de la versión A.</text>
   <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(7.2 513.989564)">Sin Ganancias de sociedades ni renta de activos externos, como la versión A. Ver scripts/10_top1.py.</text>
  </g>
 </g>
