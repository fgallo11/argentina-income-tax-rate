   <g id="text_17">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(90 39.389539)">Kakwani = concentración de los impuestos − Gini del ingreso. Positivo: progresivo (los de arriba pagan una parte mayor que su parte del ingreso);</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(90 50.192)">negativo: regresivo. Calculado con 12 grupos (deciles 1-9 y el decil 10 partido en tres): aproximado. Franja: cinco supuestos.</text>
   </g>
  </g>
  <g id="text_18">
   <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="7.2" y="17.997891" transform="rotate(-0 7.2 17.997891)">Progresividad del sistema, año por año: prácticamente cero</text>
  </g>
  <g id="text_19">
   <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(7.2 364.751578)">Fuente: elaboración propia con EPH, ENGHo e IPC (INDEC), recaudación DNIAF y anuarios de ARCA. Aglomerados urbanos de la EPH; personas ordenadas por ingreso per cápita familiar. Impuestos: Ganancias y Bienes Personales,</text>
   <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(7.2 373.393547)">aportes y contribuciones, IVA, Internos e Ingresos Brutos. Ingreso declarado antes de impuestos directos, completado arriba con el ingreso que se declara al fisco y la encuesta no capta.</text>
  </g>
 </g>
