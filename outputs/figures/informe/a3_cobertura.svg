   <g id="text_16">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(90 36.725539)">Entre 56% y 71%. Quedan afuera retenciones a la exportación, Ganancias de sociedades, cheque, combustibles, monotributo e impuestos provinciales</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(90 47.888)">y municipales distintos de Ingresos Brutos (cheque, combustibles y monotributo están como variantes). Hasta 2015 los impuestos incluidos ganaron peso en la recaudación.</text>
