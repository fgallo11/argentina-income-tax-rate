   <g id="text_17">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #0b3d7a" transform="translate(720.999539 178.837486)">Tasa en el sistema</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #0b3d7a" transform="translate(720.999539 190.240084)">progresivo  37,0%</text>
   </g>
   <g id="text_18">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #6f6e66" transform="translate(720.999539 314.718368)">Tasa promedio (sistema</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #6f6e66" transform="translate(720.999539 326.120965)">proporcional)  23,6%</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #e34948" x="720.999539" y="368.150312" transform="rotate(-0 720.999539 368.150312)">Tasa del 1%  21,7%</text>
   </g>
  </g>
  <g id="text_20">
   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="7.2" y="18.397812" transform="rotate(-0 7.2 18.397812)">El 1% más rico: la tasa que paga y la que pagaría con cada sistema de referencia, 2004-2025</text>
  </g>
  <g id="text_21">
   <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(7.2 41.003449)">Roja: la tasa del 1%. Gris: la tasa promedio, que es la que pagaría con un sistema proporcional. Azul: la que pagaría con el progresivo de referencia.</text>
   <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(7.2 52.66202)">Sombreado rojo: años en que paga menos que el promedio; gris: años en que paga más. Celeste: la distancia hasta el progresivo.</text>
  </g>
  <g id="text_22">
   <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(7.2 497.609572)">Fuente: elaboración propia con EPH y ENGHo (INDEC), recaudación DNIAF (Ministerio de Economía), anuarios de ARCA y normativa. Aglomerados urbanos de la EPH; personas ordenadas por ingreso per cápita familiar.</text>
   <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(7.2 506.663568)">Versión A. Progresivo: tasa = promedio × (ingreso por persona del grupo ÷ promedio)^0,25, reescalada para recaudar lo mismo.</text>
  </g>
 </g>
