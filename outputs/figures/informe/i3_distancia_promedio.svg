    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2a78d6" x="669.87" y="343.399356" transform="rotate(-0 669.87 343.399356)">Decil 10  +0,0</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #e34948" x="669.87" y="273.949071" transform="rotate(-0 669.87 273.949071)">Decil 1  +5,0</text>
   </g>
   <g id="text_23">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(98.28 50.549457)">El decil 1 pagaba 12,5 puntos más que el promedio en 2004 y 5,0 en 2025. Franjas: rango entre supuestos. El valor de 2009 depende de cómo se</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(98.28 61.712)">combinan las ediciones de la ENGHo (punteado vertical): con otra forma de combinarlas el decil 1 da 4,9 puntos en vez de 12,9. Lo firme es la tendencia.</text>
   </g>
  </g>
  <g id="text_24">
   <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="7.2" y="17.997891" transform="rotate(-0 7.2 17.997891)">La distancia del decil más pobre al promedio se achicó; la del más rico oscila alrededor de cero</text>
  </g>
  <g id="text_25">
   <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(7.2 441.071578)">Fuente: elaboración propia con EPH, ENGHo e IPC (INDEC), recaudación DNIAF y anuarios de ARCA. Aglomerados urbanos de la EPH; personas ordenadas por ingreso per cápita familiar. Impuestos: Ganancias y Bienes Personales,</text>
   <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(7.2 449.713547)">aportes y contribuciones, IVA, Internos e Ingresos Brutos. Ingreso declarado antes de impuestos directos, completado arriba con el ingreso que se declara al fisco y la encuesta no capta.</text>
   <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(7.2 458.643516)">Franjas: mínimo y máximo entre las variantes de supuestos que miden lo mismo (excluye la lectura contra el consumo y la que usa el gasto como ingreso del decil 1).</text>
  </g>
 </g>
