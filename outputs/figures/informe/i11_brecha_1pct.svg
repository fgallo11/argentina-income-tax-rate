   <g id="text_24">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(106.56 32.719051)">Cada línea es una tasa: qué parte de su ingreso paga en impuestos. La distancia entre la roja y las otras es lo que el 1% paga de menos.</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(106.56 44.501649)">La recaudación total no cambia: lo que pagaría de más el 1% lo pagarían de menos los deciles 1 a 9.</text>
   </g>
   <g id="text_25">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="106.56" y="17.597969" transform="rotate(-0 106.56 17.597969)">El 1% más rico: cuánto paga y cuánto pagaría con otro sistema</text>
   </g>
  </g>
  <g id="text_26">
   <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(7.2 473.157523)">Ingreso completado (versión B). Con la encuesta sola (A) el 1% paga 21,7% en 2025 y las brechas son US$1,1 y US$8,9 mil millones. Dólares al tipo de cambio oficial promedio del año.</text>
   <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(7.2 482.583602)">Progresivo: la tasa crece con el ingreso por persona (elasticidad 0,25), con la misma recaudación. Cálculo mecánico: no supone cambios de comportamiento. Tabla: outputs/tables/brecha_recaudacion.csv.</text>
  </g>
 </g>
