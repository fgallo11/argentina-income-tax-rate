  <g id="text_19">
   <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(7.2 38.627449)">Kakwani = concentración de los impuestos − concentración del ingreso (Gini). Mayor que 0: progresivo; 0: proporcional; menor que 0: regresivo. Rojo: Argentina (franja: todos los supuestos de la sección 8).</text>
   <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(7.2 50.28602)">Azul punteado: el valor que tendría el sistema progresivo de referencia de esta sección, con la misma recaudación (franja: con exponente 0,15 a 0,40 en lugar de 0,25).</text>
  </g>
  <g id="text_20">
   <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(7.2 452.249572)">Fuente: elaboración propia con EPH y ENGHo (INDEC), recaudación DNIAF (Ministerio de Economía), anuarios de ARCA y normativa. Aglomerados urbanos de la EPH; personas ordenadas por ingreso per cápita familiar.</text>
   <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(7.2 461.303568)">Calculado con 12 grupos (deciles 1 a 9 y el decil 10 partido en tres): aproximado. Versión A.</text>
  </g>
 </g>
 <defs>
  <clipPath id="p5ce09012c1">
